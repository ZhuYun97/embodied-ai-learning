<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none" role="img" aria-label="具身智能机器人概念图">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f7ff"/>
      <stop offset="0.4" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="hglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="300" cy="246" rx="252" ry="240" fill="url(#halo)"/>

  <!-- decorative data constellation (subtle) -->
  <g opacity="0.5">
    <path d="M454 72 L500 96 L486 144 M500 96 L548 80" stroke="url(#hg)" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#22d3ee"><circle cx="454" cy="72" r="3.4"/><circle cx="500" cy="96" r="3.4"/><circle cx="486" cy="144" r="3.4"/><circle cx="548" cy="80" r="3.4"/></g>
  </g>

  <g stroke="url(#hg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#hglow)">
    <!-- antenna -->
    <path d="M300 70 V48"/>
    <!-- head -->
    <rect x="252" y="70" width="96" height="78" rx="22"/>
    <!-- visor / face screen -->
    <rect x="268" y="92" width="64" height="34" rx="13" fill="url(#hgv)"/>
    <!-- side aural nubs -->
    <path d="M252 102 h-10 a4 4 0 0 0 -4 4 v10 a4 4 0 0 0 4 4 h10"/>
    <path d="M348 102 h10 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-10"/>
    <!-- neck -->
    <path d="M286 148 v16 M314 148 v16"/>
    <!-- collar / shoulders -->
    <path d="M254 182 H346"/>
    <!-- torso: chest tapering to waist -->
    <path d="M256 182 L344 182 L372 240 L350 300 L324 330 L276 330 L250 300 L228 240 Z"/>
    <!-- chest seams -->
    <path d="M300 195 V232 M300 296 V330"/>
    <!-- core ring -->
    <circle cx="300" cy="250" r="32"/>
    <!-- arms -->
    <path d="M252 190 L222 248 L234 312"/>
    <path d="M348 190 L378 248 L366 312"/>
    <!-- grippers -->
    <path d="M234 312 l-12 15 M234 312 l12 15"/>
    <path d="M366 312 l-12 15 M366 312 l12 15"/>
    <!-- pelvis -->
    <rect x="272" y="330" width="56" height="20" rx="8"/>
    <!-- legs -->
    <path d="M286 350 L281 408 L280 452"/>
    <path d="M314 350 L319 408 L320 452"/>
    <!-- feet -->
    <rect x="258" y="452" width="44" height="18" rx="7"/>
    <rect x="298" y="452" width="44" height="18" rx="7"/>
  </g>

  <!-- glowing reactor core -->
  <circle cx="300" cy="250" r="18" fill="url(#core)" filter="url(#hglow)"/>
  <circle cx="300" cy="250" r="6.5" fill="#e8fbff"/>

  <!-- eyes -->
  <g fill="#bfefff" filter="url(#hglow)">
    <circle cx="285" cy="109" r="4.6"/><circle cx="315" cy="109" r="4.6"/>
  </g>
  <!-- antenna tip + joint nodes -->
  <g fill="#22d3ee" filter="url(#hglow)">
    <circle cx="300" cy="46" r="4.6"/>
    <circle cx="222" cy="248" r="4.4"/><circle cx="378" cy="248" r="4.4"/>
    <circle cx="281" cy="408" r="3.8"/><circle cx="319" cy="408" r="3.8"/>
  </g>
</svg>
