<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="具身智能学习站">
  <defs>
    <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af0ff"/><stop offset="1" stop-color="#22a8ec"/>
    </linearGradient>
    <linearGradient id="gLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e84e2"/><stop offset="1" stop-color="#0c3cae"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s  { stroke: url(#gDark); }
      .f  { fill: url(#gDark); }
      .vc { fill: #eafdff; }
      .gl { filter: url(#glow); }
      @media (prefers-color-scheme: light) {
        .s  { stroke: url(#gLight); }
        .f  { fill: url(#gLight); }
        .vc { fill: url(#gLight); }
        .gl { filter: none; }
      }
    </style>
  </defs>
  <!-- 透明底 · 悬浮发光机甲头(深色霓虹青 / 浅色电光蓝,随主题自适应) -->
  <g class="gl" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 天线 -->
    <path class="s" d="M32 18 V11.5" stroke-width="2.2"/>
    <path class="f" d="M32 6.4 l3 3.1 -3 3.1 -3 -3.1 z"/>
    <!-- 头盔主体 -->
    <path class="s" d="M22 19 H42 L47 31 L42 45 L35 50 H29 L22 45 L17 31 Z" stroke-width="2.3"/>
    <!-- 额面板线(机甲细节) -->
    <path class="s" d="M25.5 24.4 H38.5" stroke-width="1.5" opacity="0.7"/>
    <!-- 下颌气口 -->
    <path class="s" d="M28 47 H36" stroke-width="1.5" opacity="0.8"/>
  </g>
  <!-- 面甲扫描眼(主题色,深色另附炽白芯) -->
  <g class="gl">
    <rect class="f" x="23.5" y="30.4" width="17" height="5.2" rx="2.6"/>
    <rect class="vc" x="25" y="31.8" width="8.6" height="2.4" rx="1.2"/>
  </g>
</svg>
