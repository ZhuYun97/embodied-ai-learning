<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="具身智能学习站">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1d31"/><stop offset="1" stop-color="#070e1a"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af0ff"/><stop offset="1" stop-color="#1f93e6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 切角玻璃底(与按钮/卡片/导航同一套语言) -->
  <path d="M12 1 H63 V52 L52 63 H1 V12 Z" fill="url(#tile)" stroke="rgba(120,225,255,0.28)" stroke-width="1"/>
  <!-- 内 HUD 框线 -->
  <path d="M14.5 5 H59 V50 L50 59 H5 V14.5 Z" fill="none" stroke="rgba(120,225,255,0.16)" stroke-width="1"/>
  <!-- 两枚 HUD 角标(方角处) -->
  <path d="M56.5 6 H61 M60 6 V10.5 M4 58 V53.5 M5 57.5 H9.5" stroke="rgba(130,230,255,0.55)" stroke-width="1.2" fill="none"/>
  <!-- 天线 + 护目机甲头(发光描边) -->
  <g filter="url(#glow)" stroke="url(#cy)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M32 21 V16.3"/>
    <path d="M23 22 H41 L45 32 L41 41 L35 46 H29 L23 41 L19 32 Z"/>
  </g>
  <!-- 天线菱标 -->
  <path d="M32 12 l2.6 2.6 -2.6 2.6 -2.6 -2.6 z" fill="url(#cy)" filter="url(#glow)"/>
  <!-- 单条发光面甲(扫描眼) -->
  <g filter="url(#glow)">
    <rect x="24.3" y="29.8" width="15.4" height="4.6" rx="2.3" fill="url(#cy)"/>
    <rect x="25.4" y="31" width="7.6" height="2.1" rx="1.05" fill="#eafdff"/>
  </g>
  <!-- 下颌气口 -->
  <path d="M29 43.4 H35" stroke="url(#cy)" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
</svg>
